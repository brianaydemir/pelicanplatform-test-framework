---
# The `tiny` topology: the whole federation in one container. Run it
# through ./fed.sh.
#
# Same project name as docker-compose.yaml, so that the dev container
# (defined only there) shares this network, and switching topologies
# replaces the other one's containers. COMPOSE_PROJECT_NAME overrides
# both alike.
#
# Every service here extends docker-compose.yaml's, and restates only
# what differs. `extends` brings in no top-level elements, so the
# secrets below repeat docker-compose.yaml's; one missing here fails
# `docker compose config`. `!reset` drops the `firewalled` network,
# which this file has no need for.

name: pelican

secrets:
  ca-crt:
    file: ./var/certs/ca.crt
  tls-crt:
    file: ./var/certs/tls.crt
  tls-key:
    file: ./var/certs/tls.key
  oidc-client-id:
    file: ./var/generated/oidc-client-id
  oidc-client-secret:
    file: ./var/generated/oidc-client-secret
  server-web-passwd:
    file: ./etc/server-web-passwd

services:

  # origin-0, serving every module: the origin image has everything any
  # of the four needs, so IMAGE_ORIGIN applies here too. It keeps
  # origin-0's health check, environment, secrets, and shared mounts,
  # and origin-0's store.
  fed:
    extends: { file: docker-compose.yaml, service: origin-0 }
    hostname: fed
    networks: !reset []
    # The image's entrypoint, minus the module name, so that `serve` runs
    # the modules listed below in one process.
    entrypoint: ["/entrypoint.sh", "pelican-server"]
    command:
      - "serve"
      - "--module"
      - "director"
      - "--module"
      - "registry"
      - "--module"
      - "origin"
      - "--module"
      - "cache"
    # Only matter under `-p origin-metadata` and `-p auth-oidc-local`.
    depends_on: !override
      metadata: { condition: service_healthy, required: false }
      idp: { condition: service_healthy, required: false }
    deploy:
      resources:
        limits: { memory: "${FED_MEM:?run through ./fed.sh}" }
    environment:
      TZ: "${TZ_SERVICES:?run through ./fed.sh}"
    ports: !override
      - "${PORT_9000:?run through ./fed.sh}:8444"
    # Its own instance's mounts, which replace origin-0's by target, and
    # the cache's store.
    volumes:
      - ./config.d/instance/fed:/fed/conf.instance:ro
      - ./var/generated/local/fed:/fed/local.instance:ro
      - ./var/control/config/fed:/fed/control.instance:ro
      - ./var/generated/instance/fed:/fed/generated.instance:ro
      - ./var/issuer-keys/fed:/fed/issuer-keys
      - ./var/data/cache/fed:/cache
      - ./var/state/fed:/var/lib/pelican

  idp:
    extends: { file: docker-compose.yaml, service: idp }
    networks: !reset []

  # FED_DISCOVERY_URL names `fed` as the federation.
  metadata:
    extends: { file: docker-compose.yaml, service: metadata }

  metadata-verifier:
    extends: { file: docker-compose.yaml, service: metadata-verifier }
