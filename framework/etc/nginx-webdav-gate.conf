# The `webdav-gate` service: nginx in front of the `webdav` service, the
# backend of https and httpsv2 origins, which relays every request to it
# and logs the Authorization that came with it, so that the tests can
# see what an origin sends its backend: the exports suite's
# backend-token and backend-passthrough scenarios restart the origins to
# reach the backend through it (Origin.HttpServiceUrl), with a static
# token (Origin.HttpAuthTokenFile) or the client's own
# (Origin.HttpAuthTokenPassthrough). It checks nothing: the log,
# framework/var/data/webdav-gate/access.log, is the evidence, a line per
# request: the time, the method, the path, and the Authorization in
# quotes (`-` for none).

log_format gate '$msec $request_method $request_uri "$http_authorization"';

server {
    listen 8444 ssl;
    server_name webdav-gate;

    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;

    access_log /var/log/gate/access.log gate;

    # Uploads of any size, streamed through as they come, chunked or not,
    # and answers streamed back, so that nothing is buffered whole.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass https://webdav:8444;
        proxy_ssl_trusted_certificate /certs/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_ssl_name webdav;
        # Host as the origin sent it: a COPY's or MOVE's Destination names
        # this host, which the WebDAV server behind (golang.org/x/net's,
        # in rclone) must find in Host too, or it answers 502.
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }
}

# Plain HTTP for the health check.
server {
    listen 80;

    location = /healthz {
        return 200;
    }

    location / {
        return 404;
    }
}
