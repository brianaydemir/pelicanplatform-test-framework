# The `director` service (`-p director-ha`): a load balancer in front of
# the directors, passing TLS through to director-0 and director-1 in
# turn, so that each presents the framework's certificate itself, which
# names `director` (tls.req). The directors' names are resolved again
# every few seconds, through Docker's DNS, so that a director that
# `./fed.sh up`, or a test (framework/control.py), recreates at another
# address is found again, and director-1, which starts after this, is
# found once it has started; until then, nginx logs that it cannot
# resolve the name, and everything goes to director-0. A director that is
# down is skipped for a while (max_fails and fail_timeout, nginx's
# defaults), and a connection it refuses goes to the other. Resolving an
# upstream server's name at run time needs nginx 1.27.3 or later, which
# nginx:alpine is.

worker_processes 1;

events {
    worker_connections 256;
}

stream {
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream directors {
        zone directors 64k;
        server director-0:8444 resolve;
        server director-1:8444 resolve;
    }

    server {
        listen 8444;
        proxy_pass directors;
        proxy_connect_timeout 5s;
    }
}
