# The `discovery` service: the federation's metadata documents, and an
# external token issuer.
#
# The discovery URL is also the issuer of federation tokens. Origins look
# up its keys at /.well-known/openid-configuration, so without that
# document they refuse every federation token.
#
# https://discovery:8444/issuer is a token issuer that is not the
# federation's or any origin's, which the exports trust under
# `auth-external-issuer`. Its documents are in
# framework/var/generated/issuer/, which fed.sh fills only then; otherwise
# they are 404.

server {
    listen 8444 ssl;
    server_name discovery;

    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;

    location = /.well-known/pelican-configuration {
        alias /etc/nginx/html/discovery.json;
        default_type application/json;
    }

    location = /.well-known/openid-configuration {
        alias /etc/nginx/html/openid-configuration.json;
        default_type application/json;
    }

    location = /issuer/.well-known/openid-configuration {
        alias /etc/nginx/html/issuer/openid-configuration.json;
        default_type application/json;
    }

    location = /issuer/.well-known/issuer.jwks {
        alias /etc/nginx/html/issuer/issuer.jwks;
        default_type application/json;
    }

    location / {
        return 404;
    }
}

# Plain HTTP for the health check, which must fail if the document is
# missing.
server {
    listen 80;

    location = /.well-known/pelican-configuration {
        alias /etc/nginx/html/discovery.json;
        default_type application/json;
    }

    location / {
        return 404;
    }
}
