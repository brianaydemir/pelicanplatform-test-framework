# shellcheck shell=sh
# shellcheck disable=SC2034  # read by fed.sh and Compose
#
# Framework defaults, sourced by ./fed.sh before any preset. Put
# machine-specific settings in local/environment.cfg, which is sourced
# right after this file. framework/presets/default.sh comes next and sets
# every other knob, so set those in a preset instead, or, if they don't
# shape the federation, in your environment (see Knobs in
# docs/configuration.md).

# A clone of github.com/PelicanPlatform/pelican, mounted at /app in the
# dev container. Optional.
PELICAN_SRC_DIR=${HOME}/pelican

# Every service runs the published image for PELICAN_TAG. `./fed.sh init`
# downloads the matching binaries into framework/var/bin/.
IMAGE_HUB=hub.osg-htc.org/pelican_platform
PELICAN_TAG=v26.0.0-rc.5
PELICAN_DEV_TAG=latest-itb

# How far above the ports that README.md names the services' published
# ports are. smoke.sh gives each of its copies of the checkout its own,
# with a Compose project of its own (COMPOSE_PROJECT_NAME), so that
# they and the checkout can run side by side.
PORT_OFFSET=0

# To test images of your own, name them in local/environment.cfg. Each
# defaults to ${IMAGE_HUB}/<name>:<tag>.
#
# IMAGE_ORIGIN=pelican-origin:local
# IMAGE_CACHE=pelican-cache:local
# IMAGE_DIRECTOR=pelican-director:local
# IMAGE_REGISTRY=pelican-registry:local
# IMAGE_DEV=pelican-dev:local
