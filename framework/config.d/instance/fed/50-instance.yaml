---
# Settings for `fed` (the `tiny` topology) only. This layer wins over
# every other tracked layer.
#
# For local changes, add a file to local/config.d/instance/fed/
# rather than editing this one.

# One process is the whole federation, so its director hosts the
# federation metadata itself. fed.sh points the federation URLs here.
Director:
  EnableFederationMetadataHosting: true

Cache:
  # No cache role layer is mounted in this topology.
  EnableV2: true
  # The origin owns /data.
  StorageLocation: /cache
  # As in config.d/cache/v2/: for the blocks suite's cache-corrupted.
  EnableChaosAPI: true

# Where the browser returns after an OIDC login: this service's port on
# the host (see docker-compose.tiny.yaml), not its container hostname.
OIDC:
  ClientRedirectHostname: localhost:9000

# Public keys to publish beside the issuer's own, so that tokens signed
# with framework/var/test-keys/jwks.pem are accepted (see
# framework/testlib/credentials.py). Here the director publishes them
# too, since it shares the key set.
Server:
  IssuerJwks: /fed/issuer-jwks/test.jwks
