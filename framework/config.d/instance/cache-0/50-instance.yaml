---
# Settings for `cache-0` only. This layer wins over every other
# tracked layer.
#
# For local changes, add a file to local/config.d/instance/cache-0/
# rather than editing this one.

# Where the browser returns after an OIDC login: this service's port on
# the host (see docker-compose.yaml), not its container hostname.
OIDC:
  ClientRedirectHostname: localhost:8445

# Where this server says it is (Madison), which the directors sort by
# rather than by GeoIP, of which the framework has no database. The
# routing suite's distance scenario depends on it (GEO in
# framework/suites/routing.py).
GeoLocation: "43.07,-89.38"
