---
Director:
  # The `discovery` service hosts the federation metadata, as the OSDF
  # does, where the directors are interchangeable; but every director
  # serves it too (Director.EnableFederationMetadataHosting, Pelican's
  # default), because a V2 cache fetches each object through a
  # pelican:// URL of its director's host, and the client in it then
  # looks for the federation's metadata there (normalizePath in
  # local_cache/persistent_cache.go), getting 410 from a director that
  # serves none: no V2 cache would serve anything (C16 in the notes).
  # The director's document is built from its own configuration, which
  # names the same servers as the discovery service's.

  # Pelican's default, stated because short test runs depend on it.
  OriginCacheHealthTestInterval: 15s

  # Whom the director names for help, at /api/v1.0/director_ui/contact
  # and in its refusals of unapproved servers; the director-api suite
  # checks them (CONTACT_* in framework/suites/director_api.py).
  SupportContactEmail: support@pelican-testing.invalid
  SupportContactUrl: https://pelican-testing.invalid/support
