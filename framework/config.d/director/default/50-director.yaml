---
Director:
  # The `discovery` service hosts the federation metadata, as the OSDF
  # does, where the directors are interchangeable. A V2 cache of
  # v26.0.0-rc.3 and main looks for the metadata at its director, and
  # so serves nothing here (see docs/tests/README.md): that is
  # Pelican's to fix, not this file's.
  EnableFederationMetadataHosting: false

  # Pelican's default, stated because short test runs depend on it.
  OriginCacheHealthTestInterval: 15s

  # Whom the director names for help, at /api/v1.0/director_ui/contact
  # and in its refusals of unapproved servers; the director-api suite
  # checks them (CONTACT_* in framework/suites/director_api.py).
  SupportContactEmail: support@pelican-testing.invalid
  SupportContactUrl: https://pelican-testing.invalid/support
