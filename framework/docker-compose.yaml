---
# The full topology. Run it through ./fed.sh: every variable below comes
# from fed.sh (framework/environment.cfg, presets/default.sh, and the
# presets) and has no fallback here on purpose.

name: pelican

# Only the dev container's build caches live in volumes. Service state
# and data are bind-mounted from ./var/state and ./var/data.
volumes:
  go_build:
  go_pkg:
  pre_commit:
  web_next:
  web_node:
  web_npm:
  web_output:
  root_homedir:

secrets:
  ca-crt:
    file: ./var/certs/ca.crt
  tls-crt:
    file: ./var/certs/tls.crt
  tls-key:
    file: ./var/certs/tls.key
  oidc-client-id:
    file: ./var/generated/oidc-client-id
  oidc-client-secret:
    file: ./var/generated/oidc-client-secret
  server-web-passwd:
    file: ./etc/server-web-passwd

#===========================================================================
# Shared fragments
#===========================================================================

# /certs/*.crt is added to the trust store by each image's entrypoint.
# /etc/pelican is ConfigBase for root, so the other three need no
# configuration.
x-common-secrets: &common-secrets
  secrets:
    - source: ca-crt
      target: /certs/ca.crt
    - source: tls-crt
      target: /certs/tls.crt
    - source: tls-key
      target: /certs/tls.key
    - source: oidc-client-id
      target: /etc/pelican/oidc-client-id
    - source: oidc-client-secret
      target: /etc/pelican/oidc-client-secret
    - source: server-web-passwd
      target: /etc/pelican/server-web-passwd

# Mounts common to every Pelican service. Each service also mounts its
# own /fed/conf.role, /fed/conf.instance, /fed/local.instance,
# /fed/control.instance, /fed/generated.instance, /fed/issuer-keys, and
# /var/lib/pelican. See etc/pelican.yaml for the configuration layers.
# fed.sh copies ../local/config.d into ./var/generated/local, so that the
# framework never writes to local/.
x-vol-health: &vol-health "./service-health.sh:/fed/bin/service-health.sh:ro"
x-vol-generated: &vol-generated "./var/generated:/fed/generated:ro"
x-vol-conf-root: &vol-conf-root "./etc/pelican.yaml:/etc/pelican/pelican.yaml:ro"
x-vol-conf-base: &vol-conf-base "./config.d/base:/fed/conf.base:ro"
x-vol-local-base: &vol-local-base "./var/generated/local/base:/fed/local.base:ro"

x-pelican-env: &pelican-env
  TZ: "${TZ_SERVICES:?run through ./fed.sh}"

# Environment beats every configuration file, so a file cannot change
# these: fed.sh and the tests depend on them. Presets toggle them.
#
# Every Pelican server, but not the client in dev.
x-server-env: &server-env
  PELICAN_SERVER_DROPPRIVILEGES: "${SERVER_DROP_PRIVILEGES:?run through ./fed.sh}"

x-origin-env: &origin-env
  PELICAN_ORIGIN_ENABLEISSUER: "${ORIGIN_ENABLE_ISSUER:?run through ./fed.sh}"
  PELICAN_ORIGIN_POSC_ENABLED: "${ORIGIN_POSC:?run through ./fed.sh}"
  PELICAN_ORIGIN_ENABLEATOMICUPLOADS: "${ORIGIN_ATOMIC_UPLOADS:?run through ./fed.sh}"
  # May be empty, hence ? rather than :?.
  PELICAN_ORIGIN_CACHECONTROL: "${ORIGIN_CACHE_CONTROL?run through ./fed.sh}"
  PELICAN_ORIGIN_METADATA_ENABLED: "${ORIGIN_METADATA:?run through ./fed.sh}"
  PELICAN_ORIGIN_METADATA_TRACKACCESS: "${ORIGIN_METADATA:?run through ./fed.sh}"
  PELICAN_ORIGIN_METADATA_MODE: "${ORIGIN_METADATA_MODE:?run through ./fed.sh}"
  PELICAN_ORIGIN_DISABLEDIRECTCLIENTS: "${ORIGIN_DISABLE_DIRECT_CLIENTS:?run through ./fed.sh}"
  PELICAN_ORIGIN_MULTIUSER: "${ORIGIN_MULTIUSER:?run through ./fed.sh}"
  PELICAN_ORIGIN_ENABLESTANDALONEMODE: "${ORIGIN_STANDALONE:?run through ./fed.sh}"
  PELICAN_ORIGIN_ENABLETRANSFERAPI: "${ORIGIN_TRANSFER_API:?run through ./fed.sh}"

x-pelican-health: &pelican-health
  test: ["CMD", "/fed/bin/service-health.sh"]
  start_period: 90s
  start_interval: 2s
  interval: 30s
  timeout: 10s
  retries: 3

# `required: false`: a standalone origin (`-p topo-standalone`) runs
# without them.
x-needs-federation: &needs-federation
  discovery: { condition: service_healthy, required: false }
  director-0: { condition: service_healthy, required: false }
  registry: { condition: service_healthy, required: false }
  idp: { condition: service_healthy, required: false }

# A cache starts once origin-0 is up, so that it soon learns the
# namespaces' issuers. The federation suite
# (framework/suites/federation.py) waits until it has. Under
# `-p cache-tiered`, it also needs the `s3` service, without which it
# refuses to start.
x-needs-origin: &needs-origin
  origin-0: { condition: service_healthy }
  s3: { condition: service_healthy, required: false }

# Only matters under `-p origin-ssh`; `required: false` makes it a no-op
# when the lab server is not started.
x-needs-lab: &needs-lab
  lab-server: { condition: service_healthy, required: false }

# Likewise for `-p origin-metadata`.
x-needs-metadata: &needs-metadata
  metadata: { condition: service_healthy, required: false }

# Likewise for the origins' HTTPS and S3 backends. An origin checks its
# backend on every request, so this only spares the first ones a 503.
x-needs-backends: &needs-backends
  webdav: { condition: service_healthy, required: false }
  s3: { condition: service_healthy, required: false }

#===========================================================================
# Services
#
# `hostname` matters: it determines Server.ExternalWebUrl, and so each
# origin's issuer URL, which fed.sh must reproduce exactly. Each Pelican
# server's host port is repeated in its config.d/instance/ file.
#
# fed.sh enables the `federation` profile but for a standalone origin;
# `discovery` with it, unless director-0 serves the federation's metadata
# (`-p director-discovery`); and `external-issuer` for
# `-p auth-external-issuer`.
#===========================================================================

services:

  # An identity provider of the framework's own (`-p auth-oidc`), which
  # the servers send their users to log in through, and the registry
  # asks for a user's identity (idp/idp.py). Its users are
  # etc/idp-users.json; its client is the one the servers read from
  # ./var/generated/oidc-client-{id,secret}. It logs every request in
  # ./var/data/idp/requests.log. Its port is the same inside and out, so
  # that https://idp:9007 serves a browser too, given a hosts entry.
  idp:
    hostname: idp
    image: python:3-alpine
    profiles: ["idp"]
    command: ["python3", "-u", "/fed/bin/idp.py"]
    environment:
      IDP_ISSUER: https://idp:9007
      IDP_PORT: "9007"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import ssl, urllib.request; c = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT); c.check_hostname = False; c.verify_mode = ssl.CERT_NONE; urllib.request.urlopen('https://127.0.0.1:9007/healthz', context=c, timeout=5)"
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits: { memory: 64M }
    ports:
      - "9007:9007"
    volumes:
      - ./idp/idp.py:/fed/bin/idp.py:ro
      - ./etc/idp-users.json:/fed/idp/users.json:ro
      - ./var/generated:/fed/generated:ro
      - ./var/data/idp:/var/log/idp
    secrets:
      - source: tls-crt
        target: /certs/tls.crt
      - source: tls-key
        target: /certs/tls.key

  # Hosts the federation metadata outside any director, as the OSDF does,
  # where the directors are interchangeable. Under `-p director-discovery`,
  # director-0 hosts it instead, and this runs only for the external
  # issuer, if at all.
  discovery:
    hostname: discovery
    image: nginx:alpine
    profiles: ["discovery", "external-issuer"]
    # 127.0.0.1, not localhost: BusyBox wget tries only the first address,
    # which may be ::1, and nginx listens on IPv4 only.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null",
             "http://127.0.0.1/.well-known/pelican-configuration"]
      start_period: 10s
      start_interval: 1s
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits: { memory: 32M }
    ports:
      - "9005:8444"
    volumes:
      - ./etc/nginx-discovery.conf:/etc/nginx/conf.d/default.conf:ro
      - ./var/generated/discovery.json:/etc/nginx/html/discovery.json:ro
      - ./var/generated/openid-configuration.json:/etc/nginx/html/openid-configuration.json:ro
      # A directory, so that fed.sh can add and remove the external
      # issuer's documents (`auth-external-issuer`) while nginx runs.
      - ./var/generated/issuer:/etc/nginx/html/issuer:ro
    secrets:
      - source: tls-crt
        target: /certs/tls.crt
      - source: tls-key
        target: /certs/tls.key

  director-0:
    hostname: director-0
    image: "${IMAGE_DIRECTOR:?run through ./fed.sh}"
    profiles: ["federation"]
    healthcheck: *pelican-health
    depends_on:
      discovery: { condition: service_healthy, required: false }
      idp: { condition: service_healthy, required: false }
    deploy:
      resources:
        limits: { memory: "${DIRECTOR_MEM:?run through ./fed.sh}" }
    environment:
      <<: [*pelican-env, *server-env]
    ports:
      - "9000:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - *vol-local-base
      - ./config.d/director/default:/fed/conf.role:ro
      - ./config.d/instance/director-0:/fed/conf.instance:ro
      - ./var/generated/local/director-0:/fed/local.instance:ro
      - ./var/control/config/director-0:/fed/control.instance:ro
      - ./var/generated/instance/director-0:/fed/generated.instance:ro
      - ./var/issuer-keys/director-0:/fed/issuer-keys
      - ./var/state/director-0:/var/lib/pelican
    <<: *common-secrets

  # Another director (`-p topo-multi-director`), which must hold
  # director-0's key: both sign as the federation, whose JWKS is
  # director-0's. `./fed.sh keys` keeps the two in step.
  # Likewise after director-0, its discovery host under
  # `-p director-discovery`.
  director-1:
    hostname: director-1
    image: "${IMAGE_DIRECTOR:?run through ./fed.sh}"
    profiles: ["multi-director"]
    healthcheck: *pelican-health
    depends_on:
      discovery: { condition: service_healthy, required: false }
      director-0: { condition: service_healthy }
      idp: { condition: service_healthy, required: false }
    deploy:
      resources:
        limits: { memory: "${DIRECTOR_MEM:?run through ./fed.sh}" }
    environment:
      <<: [*pelican-env, *server-env]
    ports:
      - "9004:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - *vol-local-base
      - ./config.d/director/default:/fed/conf.role:ro
      - ./config.d/instance/director-1:/fed/conf.instance:ro
      - ./var/generated/local/director-1:/fed/local.instance:ro
      - ./var/control/config/director-1:/fed/control.instance:ro
      - ./var/generated/instance/director-1:/fed/generated.instance:ro
      - ./var/issuer-keys/director-1:/fed/issuer-keys
      - ./var/state/director-1:/var/lib/pelican
    <<: *common-secrets

  # A load balancer in front of the directors (`-p director-ha`): nginx,
  # passing TLS through to director-0 and director-1 in turn
  # (etc/nginx-director.conf), at the name the federation's metadata
  # gives its director, which clients and every server's configuration
  # use. It resolves the directors' names again as it runs, so a
  # director that `up` or a test recreates is found again. The directors
  # present the framework's certificate, which names `director`
  # (etc/tls.req).
  director:
    hostname: director
    image: nginx:alpine
    profiles: ["director-ha"]
    depends_on:
      director-0: { condition: service_healthy }
      director-1: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8444"]
      start_period: 10s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 32M }
    ports:
      - "9008:8444"
    volumes:
      - ./etc/nginx-director.conf:/etc/nginx/nginx.conf:ro

  # It starts after director-0, which under `-p director-discovery` it
  # discovers the federation through; a director needs no registry to
  # start.
  registry:
    hostname: registry
    image: "${IMAGE_REGISTRY:?run through ./fed.sh}"
    profiles: ["federation"]
    healthcheck: *pelican-health
    depends_on:
      discovery: { condition: service_healthy, required: false }
      director-0: { condition: service_healthy }
      idp: { condition: service_healthy, required: false }
    deploy:
      resources:
        limits: { memory: "${REGISTRY_MEM:?run through ./fed.sh}" }
    environment:
      <<: [*pelican-env, *server-env]
    ports:
      - "9001:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - *vol-local-base
      - ./config.d/registry/default:/fed/conf.role:ro
      - ./config.d/instance/registry:/fed/conf.instance:ro
      - ./var/generated/local/registry:/fed/local.instance:ro
      - ./var/control/config/registry:/fed/control.instance:ro
      - ./var/generated/instance/registry:/fed/generated.instance:ro
      - ./var/issuer-keys/registry:/fed/issuer-keys
      - ./var/state/registry:/var/lib/pelican
    <<: *common-secrets

  origin-0:
    hostname: origin-0
    image: "${IMAGE_ORIGIN:?run through ./fed.sh}"
    healthcheck: *pelican-health
    depends_on:
      <<: [*needs-federation, *needs-lab, *needs-metadata, *needs-backends]
    deploy:
      resources:
        limits: { memory: "${ORIGIN_MEM:?run through ./fed.sh}" }
    # TZ is named explicitly: a merge key loses to an explicit key.
    environment:
      <<: [*pelican-env, *server-env, *origin-env]
      TZ: "${TZ_STORAGE:?run through ./fed.sh}"
    ports:
      - "8444:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - *vol-local-base
      - "./config.d/origin/${ORIGIN_VARIANT:?run through ./fed.sh}:/fed/conf.role:ro"
      - ./config.d/instance/origin-0:/fed/conf.instance:ro
      - ./var/generated/local/origin-0:/fed/local.instance:ro
      - ./var/control/config/origin-0:/fed/control.instance:ro
      - ./var/generated/instance/origin-0:/fed/generated.instance:ro
      - ./var/issuer-keys/origin-0:/fed/issuer-keys
      # Server.IssuerJwks (config.d/instance/origin-0/): public keys only.
      - ./var/issuer-jwks:/fed/issuer-jwks:ro
      - ./var/data/origin/0:/data
      - ./var/state/origin-0:/var/lib/pelican
    <<: *common-secrets

  origin-1:
    hostname: origin-1
    image: "${IMAGE_ORIGIN:?run through ./fed.sh}"
    profiles: ["multi-origin"]
    healthcheck: *pelican-health
    depends_on:
      <<: [*needs-federation, *needs-lab, *needs-metadata, *needs-backends]
    deploy:
      resources:
        limits: { memory: "${ORIGIN_MEM:?run through ./fed.sh}" }
    environment:
      <<: [*pelican-env, *server-env, *origin-env]
      TZ: "${TZ_STORAGE:?run through ./fed.sh}"
    ports:
      - "8446:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - *vol-local-base
      - "./config.d/origin/${ORIGIN_VARIANT:?run through ./fed.sh}:/fed/conf.role:ro"
      - ./config.d/instance/origin-1:/fed/conf.instance:ro
      - ./var/generated/local/origin-1:/fed/local.instance:ro
      - ./var/control/config/origin-1:/fed/control.instance:ro
      - ./var/generated/instance/origin-1:/fed/generated.instance:ro
      # Must hold origin-0's key: both export the same prefixes, and the
      # registry binds one keyset per prefix. `./fed.sh keys` keeps the
      # two in step.
      - ./var/issuer-keys/origin-1:/fed/issuer-keys
      # Server.IssuerJwks (config.d/instance/origin-1/): public keys only.
      - ./var/issuer-jwks:/fed/issuer-jwks:ro
      - ./var/data/origin/1:/data
      - ./var/state/origin-1:/var/lib/pelican
    <<: *common-secrets

  # Another owner (`-p topo-multi-owner`): prefixes and a key of its own,
  # and always its own issuer, even when origin-0 and origin-1 trust an
  # external one. fed.sh writes its exports in
  # ./var/generated/instance/origin-2.
  origin-2:
    hostname: origin-2
    image: "${IMAGE_ORIGIN:?run through ./fed.sh}"
    profiles: ["multi-owner"]
    healthcheck: *pelican-health
    depends_on:
      <<: [*needs-federation, *needs-metadata, *needs-backends]
    deploy:
      resources:
        limits: { memory: "${ORIGIN_MEM:?run through ./fed.sh}" }
    environment:
      <<: [*pelican-env, *server-env, *origin-env]
      TZ: "${TZ_STORAGE:?run through ./fed.sh}"
      PELICAN_ORIGIN_ENABLEISSUER: "true"
    ports:
      - "8448:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - *vol-local-base
      - "./config.d/origin/${ORIGIN_VARIANT:?run through ./fed.sh}:/fed/conf.role:ro"
      - ./config.d/instance/origin-2:/fed/conf.instance:ro
      - ./var/generated/local/origin-2:/fed/local.instance:ro
      - ./var/control/config/origin-2:/fed/control.instance:ro
      - ./var/generated/instance/origin-2:/fed/generated.instance:ro
      - ./var/issuer-keys/origin-2:/fed/issuer-keys
      - ./var/data/origin/2:/data
      - ./var/state/origin-2:/var/lib/pelican
    <<: *common-secrets

  # fed.sh enables `cache` with `federation`, unless the shape runs no
  # cache (`-p topo-no-cache`).
  cache-0:
    hostname: cache-0
    image: "${IMAGE_CACHE:?run through ./fed.sh}"
    profiles: ["cache"]
    healthcheck: *pelican-health
    depends_on:
      <<: [*needs-federation, *needs-origin]
    deploy:
      resources:
        limits: { memory: "${CACHE_MEM:?run through ./fed.sh}" }
    environment:
      <<: [*pelican-env, *server-env]
      TZ: "${TZ_STORAGE:?run through ./fed.sh}"
    ports:
      - "8445:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - *vol-local-base
      - "./config.d/cache/${CACHE_VARIANT:?run through ./fed.sh}:/fed/conf.role:ro"
      - ./config.d/instance/cache-0:/fed/conf.instance:ro
      - ./var/generated/local/cache-0:/fed/local.instance:ro
      - ./var/control/config/cache-0:/fed/control.instance:ro
      - ./var/generated/instance/cache-0:/fed/generated.instance:ro
      - ./var/issuer-keys/cache-0:/fed/issuer-keys
      - ./var/data/cache/0:/data
      - ./var/state/cache-0:/var/lib/pelican
    <<: *common-secrets

  cache-1:
    hostname: cache-1
    image: "${IMAGE_CACHE:?run through ./fed.sh}"
    profiles: ["multi-cache"]
    healthcheck: *pelican-health
    depends_on:
      <<: [*needs-federation, *needs-origin]
    deploy:
      resources:
        limits: { memory: "${CACHE_MEM:?run through ./fed.sh}" }
    environment:
      <<: [*pelican-env, *server-env]
      TZ: "${TZ_STORAGE:?run through ./fed.sh}"
    ports:
      - "8447:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - *vol-local-base
      - "./config.d/cache/${CACHE_1_VARIANT:?run through ./fed.sh}:/fed/conf.role:ro"
      - ./config.d/instance/cache-1:/fed/conf.instance:ro
      - ./var/generated/local/cache-1:/fed/local.instance:ro
      - ./var/control/config/cache-1:/fed/control.instance:ro
      - ./var/generated/instance/cache-1:/fed/generated.instance:ro
      - ./var/issuer-keys/cache-1:/fed/issuer-keys
      - ./var/data/cache/1:/data
      - ./var/state/cache-1:/var/lib/pelican
    <<: *common-secrets

  # A site-local cache (`-p topo-site-local-cache`), which the director
  # does not know of.
  cache-2:
    hostname: cache-2
    image: "${IMAGE_CACHE:?run through ./fed.sh}"
    profiles: ["site-local-cache"]
    healthcheck: *pelican-health
    # It fetches objects through cache-0.
    depends_on:
      <<: [*needs-federation, *needs-origin]
      cache-0: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: "${CACHE_MEM:?run through ./fed.sh}" }
    environment:
      <<: [*pelican-env, *server-env]
      TZ: "${TZ_STORAGE:?run through ./fed.sh}"
      PELICAN_CACHE_ENABLESITELOCALMODE: "true"
    ports:
      - "8449:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - *vol-local-base
      - "./config.d/cache/${CACHE_VARIANT:?run through ./fed.sh}:/fed/conf.role:ro"
      - ./config.d/instance/cache-2:/fed/conf.instance:ro
      - ./var/generated/local/cache-2:/fed/local.instance:ro
      - ./var/control/config/cache-2:/fed/control.instance:ro
      - ./var/generated/instance/cache-2:/fed/generated.instance:ro
      - ./var/issuer-keys/cache-2:/fed/issuer-keys
      - ./var/data/cache/2:/data
      - ./var/state/cache-2:/var/lib/pelican
    <<: *common-secrets

  # A transfer server of its own (`-p topo-transfer-server`): the transfer
  # module alone, in a process of its own, from the origin image, whose
  # pelican-server has every module, as the `tiny` topology runs it
  # (docker-compose.tiny.yaml). It needs no storage.
  transfer:
    hostname: transfer
    image: "${IMAGE_ORIGIN:?run through ./fed.sh}"
    profiles: ["transfer"]
    entrypoint: ["/entrypoint.sh", "pelican-server"]
    command: ["serve", "--module", "transfer"]
    healthcheck: *pelican-health
    depends_on:
      <<: *needs-federation
    deploy:
      resources:
        limits: { memory: "${TRANSFER_MEM:?run through ./fed.sh}" }
    environment:
      <<: [*pelican-env, *server-env]
    ports:
      - "9006:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - *vol-local-base
      - ./config.d/none:/fed/conf.role:ro
      - ./config.d/instance/transfer:/fed/conf.instance:ro
      - ./var/generated/local/transfer:/fed/local.instance:ro
      - ./var/control/config/transfer:/fed/control.instance:ro
      - ./var/generated/instance/transfer:/fed/generated.instance:ro
      - ./var/issuer-keys/transfer:/fed/issuer-keys
      - ./var/state/transfer:/var/lib/pelican
    <<: *common-secrets

  # Build environment and test client. The image ships no Pelican binary;
  # the tests use framework/var/bin/linux via the checkout mounted
  # at /scratch.
  dev:
    hostname: dev
    image: "${IMAGE_DEV:?run through ./fed.sh}"
    command: ["tini", "--", "/bin/sleep", "infinity"]
    deploy:
      resources:
        limits: { memory: "${DEV_MEM:?run through ./fed.sh}" }
    environment: *pelican-env
    ports:
      - "9002:8444"
    volumes:
      - "${PELICAN_SRC_DIR:?run through ./fed.sh}:/app"
      - ..:/scratch
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - *vol-local-base
      - ./config.d/none:/fed/conf.role:ro
      - ./config.d/instance/dev:/fed/conf.instance:ro
      - ./var/generated/local/dev:/fed/local.instance:ro
      - ./var/control/config/dev:/fed/control.instance:ro
      - ./var/generated/instance/dev:/fed/generated.instance:ro
      # fed.sh creates this file if missing; otherwise Docker would create
      # a directory in its place.
      - "${HOME}/.gitconfig:/root/.gitconfig:ro"
      - go_build:/root/.cache/go-build
      - go_pkg:/root/go
      - pre_commit:/root/.cache/pre-commit
      - web_next:/app/web_ui/frontend/.next
      - web_node:/app/web_ui/frontend/node_modules
      - web_npm:/root/.npm
      - web_output:/app/web_ui/frontend/public/data
      - root_homedir:/root
    <<: *common-secrets

  lab-server:
    hostname: lab-server
    image: pelican-lab-server:local
    profiles: ["lab"]
    # Rebuild on every `up` (cached), so Dockerfile changes take effect.
    pull_policy: build
    build:
      context: ./lab-server
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/22"]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 128M }
    volumes:
      - ./var/data/lab-server:/data
      - ./var/generated/ssh/authorized_keys:/home/alice/.ssh/authorized_keys:ro

  # The backend of https and httpsv2 origins (-p origin-https,
  # -p origin-httpsv2): rclone serving each origin's store,
  # ./var/data/origin/<N>, as /origin-<N>, over WebDAV
  # (golang.org/x/net/webdav, as in Pelican's own tests). The tests read
  # and write the stores directly too, so it caches no directory
  # listings. It asks for no credentials; `webdav-gate` records what the
  # origins would send one.
  webdav:
    hostname: webdav
    image: rclone/rclone:1.75.1
    profiles: ["webdav"]
    command:
      - serve
      - webdav
      - /srv
      - --addr=:8444
      - --cert=/certs/tls.crt
      - --key=/certs/tls.key
      - --dir-cache-time=0s
    healthcheck: &rclone-health
      test: ["CMD", "nc", "-z", "127.0.0.1", "8444"]
      start_period: 10s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 128M }
    volumes:
      - ./var/data/origin/0:/srv/origin-0
      - ./var/data/origin/1:/srv/origin-1
      - ./var/data/origin/2:/srv/origin-2
    secrets: &rclone-secrets
      - source: tls-crt
        target: /certs/tls.crt
      - source: tls-key
        target: /certs/tls.key

  # A gate in front of the `webdav` service, which logs the Authorization
  # of every request it relays (etc/nginx-webdav-gate.conf), in
  # ./var/data/webdav-gate/access.log. The origins reach their backend
  # through it only while the exports suite's backend-token and
  # backend-passthrough scenarios have restarted them to, so that the
  # tests can see what an origin sends its backend.
  webdav-gate:
    hostname: webdav-gate
    image: nginx:alpine
    profiles: ["webdav"]
    depends_on:
      webdav: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/healthz"]
      start_period: 10s
      start_interval: 1s
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits: { memory: 32M }
    volumes:
      - ./etc/nginx-webdav-gate.conf:/etc/nginx/conf.d/default.conf:ro
      - ./var/data/webdav-gate:/var/log/gate
    secrets:
      - source: ca-crt
        target: /certs/ca.crt
      - source: tls-crt
        target: /certs/tls.crt
      - source: tls-key
        target: /certs/tls.key

  # The backend of s3 and s3v2 origins (-p origin-s3, -p origin-s3v2):
  # rclone serving each origin's store as bucket origin-<N>, over S3; each
  # export's directory in it as bucket origin-<N>-<directory>, for an s3
  # origin, which takes a bucket per export (fed_s3_bucket in fed.sh); and
  # ./var/data/tier as bucket `tier` (-p cache-tiered). The credentials
  # are the origins', which fed.sh copies from framework/etc/ or
  # local/etc/. It keeps the directories that init-data.py made, writable
  # by any uid, even when their last object goes. Multipart uploads, as
  # the caches' are, take memory to buffer.
  s3:
    hostname: s3
    image: rclone/rclone:1.75.1
    profiles: ["s3"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec rclone serve s3 /srv --addr=:8444
        --cert=/certs/tls.crt --key=/certs/tls.key
        --auth-key="$$(cat /fed/s3-access-key),$$(cat /fed/s3-secret-key)"
        --dir-cache-time=0s --no-cleanup
    healthcheck: *rclone-health
    deploy:
      resources:
        limits: { memory: 512M }
    volumes:
      - ./var/data/origin/0:/srv/origin-0
      - ./var/data/origin/1:/srv/origin-1
      - ./var/data/origin/2:/srv/origin-2
      - ./var/data/origin/0/public:/srv/origin-0-public
      - ./var/data/origin/0/protected-a:/srv/origin-0-protected-a
      - ./var/data/origin/0/protected-b:/srv/origin-0-protected-b
      - ./var/data/origin/1/public:/srv/origin-1-public
      - ./var/data/origin/1/protected-a:/srv/origin-1-protected-a
      - ./var/data/origin/1/protected-b:/srv/origin-1-protected-b
      - ./var/data/origin/2/other:/srv/origin-2-other
      - ./var/data/origin/2/public-other:/srv/origin-2-public-other
      - ./var/data/origin/2/public-secret:/srv/origin-2-public-secret
      # Bucket `tier`, which the caches tier to (-p cache-tiered).
      - ./var/data/tier:/srv/tier
      - ./var/generated/s3-access-key:/fed/s3-access-key:ro
      - ./var/generated/s3-secret-key:/fed/s3-secret-key:ro
    secrets: *rclone-secrets

  # The origins' metadata receiver (-p origin-metadata). The recorder
  # saves each request in ./var/data/metadata and passes it to the
  # verifier, whose answer it returns. It can also fail on purpose; see
  # metadata-server/recorder.py.
  metadata:
    hostname: metadata
    image: python:3-alpine
    profiles: ["metadata"]
    command: ["python3", "-u", "/fed/bin/recorder.py"]
    depends_on:
      metadata-verifier: { condition: service_healthy }
    environment:
      RECORDER_UPSTREAM: http://metadata-verifier:9999/events
      RECORDER_DIR: /captures
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9999/healthz"]
      start_period: 10s
      start_interval: 1s
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits: { memory: 64M }
    volumes:
      - ./metadata-server/recorder.py:/fed/bin/recorder.py:ro
      - ./var/data/metadata:/captures

  # Pelican's reference receiver, which checks each event's token against
  # the registry. The audience is the origins' Origin.Metadata.Endpoint
  # (config.d/base/40-origin.yaml), which names the recorder.
  metadata-verifier:
    hostname: metadata-verifier
    image: pelican-metadata-verifier:local
    profiles: ["metadata"]
    # Rebuild on every `up` (cached), so a new PELICAN_TAG takes effect.
    pull_policy: build
    build:
      context: ./metadata-server
      args:
        PELICAN_TAG: "${PELICAN_TAG:?run through ./fed.sh}"
    command:
      - "-addr=:9999"
      - "-path=/events"
      - "-audience=http://metadata:9999/events"
      - "-federation=${FED_DISCOVERY_URL:?run through ./fed.sh}"
      - "-ca=/certs/ca.crt"
      - "-require-namespace-scope"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9999/healthz"]
      start_period: 10s
      start_interval: 1s
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits: { memory: 64M }
    secrets:
      - source: ca-crt
        target: /certs/ca.crt

  grafana:
    hostname: grafana
    # Pinned: Grafana migrates ./var/grafana forward with no way back.
    image: grafana/grafana:13.1
    profiles: ["monitoring"]
    # So that it can write ./var/grafana on a Linux host.
    user: root
    deploy:
      resources:
        limits: { memory: 256M }
    environment:
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "9003:3000"
    volumes:
      - ./var/grafana:/var/lib/grafana
