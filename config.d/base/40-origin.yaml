---
# Shared by every origin variant (and ignored by other services).
#
# Origin.EnableIssuer and Origin.EnableOIDC are set through environment
# variables from presets/default.sh, which beat any file. Setting them
# here has no effect.

Origin:
  # Required for public reads to be advertised and, under XRootD, allowed.
  EnablePublicReads: true

  # Both prefixes export the same objects, so the authenticated and
  # unauthenticated paths are comparable. A later layer replaces this
  # list wholesale (see config.d/origin/pstore/ and fed.sh's
  # fed_generate).
  Exports:
    - FederationPrefix: /public
      Capabilities: ["PublicReads", "Listings", "DirectReads"]
      StoragePrefix: /data

    - FederationPrefix: /private
      Capabilities: ["Reads", "Writes", "Listings", "DirectReads"]
      StoragePrefix: /data

# What the embedded issuer grants a user who logs in through the web UI.
# run.sh does not use it.
Issuer:
  AuthorizationTemplates:
    - prefix: /public
      actions: [read]
    - prefix: /private
      actions: [read, create, modify]
