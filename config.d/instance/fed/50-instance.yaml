---
# Settings for `fed` (the `tiny` topology) only. This layer wins over
# every other.
#
# For local changes, add an untracked file here (e.g. 90-local.yaml)
# rather than editing this one; `git status` will show it.

# One process is the whole federation, and its director hosts the
# federation metadata itself.
Federation:
  DiscoveryUrl: https://fed:8444
  DirectorUrl: https://fed:8444
  RegistryUrl: https://fed:8444

Director:
  EnableFederationMetadataHosting: true

Server:
  DirectorUrls: ["https://fed:8444"]

Cache:
  # No cache role layer is mounted in this topology.
  EnableV2: true
  # The origin owns /data.
  StorageLocation: /cache
