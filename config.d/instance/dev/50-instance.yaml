# Settings for `dev` only. This layer wins over every other.
#
# For local changes, add an untracked file here (e.g. 90-local.yaml)
# rather than editing this one; `git status` will show it.

# dev has no /fed/issuer-keys mount. Point the client somewhere writable
# in case it decides it needs a key of its own.
IssuerKeysDirectory: /etc/pelican/issuer-keys
