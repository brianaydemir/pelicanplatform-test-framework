---
Origin:
  StorageType: posix
  EnablePublicReads: true
  Exports:
    # NOTE: We need to explicitly set issuer URLs because only `origin-0`
    # might be running an issuer.

    # NOTE: Yes, both namespaces export the same set of objects. I'm lazy.

    - FederationPrefix: /public
      Capabilities: ["PublicReads", "Listings", "DirectReads"]
      IssuerUrls: ["https://origin-0:8444"]
      StoragePrefix: /data

    - FederationPrefix: /private
      Capabilities: ["Reads", "Writes", "Listings", "DirectReads"]
      IssuerUrls: ["https://origin-0:8444"]
      StoragePrefix: /data

XRootD:
  # Ensure that auth policies are up-to-date soon after start up
  AuthRefreshInterval: 1m

  # Do not wait for in-flight transfers to complete
  ShutdownTimeout: 2s
