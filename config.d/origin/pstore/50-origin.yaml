---
# The Pelican store. StoragePrefix is a path in the store's catalog, not
# on disk. If you change Exports here, update the `pstore` case in
# fed.sh's fed_generate too (used by `-p multi`).

Origin:
  StorageType: pstore
  PStoreLocation: /data/pstore

  # Shortened so a test run exercises the verification passes.
  PStoreIndexCheckInterval: 5m
  PStoreDataScanInterval: 15m

  Exports:
    - FederationPrefix: /public
      Capabilities: ["PublicReads", "Listings", "DirectReads", "Writes"]
      StoragePrefix: /public

    - FederationPrefix: /private
      Capabilities: ["Reads", "Writes", "Listings", "DirectReads"]
      StoragePrefix: /private
