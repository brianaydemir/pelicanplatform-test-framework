# The `discovery` service: the federation's metadata documents and
# nothing else.
#
# The discovery URL is also the issuer of federation tokens, so verifiers
# look up its keys at /.well-known/openid-configuration. Without that
# document, every federation token fails verification.

server {
    listen 8444 ssl;
    server_name discovery;

    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;

    location = /.well-known/pelican-configuration {
        alias /etc/nginx/html/discovery.json;
        default_type application/json;
    }

    location = /.well-known/openid-configuration {
        alias /etc/nginx/html/openid-configuration.json;
        default_type application/json;
    }

    location / {
        return 404;
    }
}

# Plain HTTP for the health check, which must fail if the document is
# missing.
server {
    listen 80;

    location = /.well-known/pelican-configuration {
        alias /etc/nginx/html/discovery.json;
        default_type application/json;
    }

    location / {
        return 404;
    }
}
