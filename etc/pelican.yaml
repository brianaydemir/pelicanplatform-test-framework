---
# Root configuration for every Pelican service. Later directories win.
# Within a directory, files merge in lexicographic order (hence NN-).
# Every directory must exist, or Pelican refuses to start.
#
#   /usr/share/pelican/config.d   shipped in the image
#   /etc/pelican/config.d         shipped in the image
#   /fed/conf.base                config.d/base
#   /fed/conf.role                config.d/<role>/<variant>
#   /fed/generated/conf           written by fed.sh
#   /fed/conf.instance            config.d/instance/<service>

ConfigLocations:
  - /usr/share/pelican/config.d
  - /etc/pelican/config.d
  - /fed/conf.base
  - /fed/conf.role
  - /fed/generated/conf
  - /fed/conf.instance
