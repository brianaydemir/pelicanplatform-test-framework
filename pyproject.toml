# Project configuration (https://packaging.python.org)

[project]
name = "brianaydemir-pelicanplatform-test-framework"
version = "0.0.0"
description = "brianaydemir-pelicanplatform-test-framework"
readme = "README.md"
# Also the tag of the python images in framework/docker-compose*.yaml.
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
authors = [{ name = "Brian Aydemir", email = "baydemir@morgridge.org" }]
dependencies = []

[project.urls]
project = "https://github.com/brianaydemir/pelicanplatform-test-framework"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling~=1.32"]

[dependency-groups]
# uv reads this table and installs the "dev" group by default.
dev = [
    "bandit~=1.9.0",
    "black~=26.10.0",
    "isort~=9.0.0",
    "pre-commit~=4.7.0",
    "pylint~=4.1.0",
    "pyright~=1.1.0",
    "pytest~=9.1.0",
]

[tool.bandit]
exclude_dirs = [".venv", "dist", "tests"]
skips = [
    # chmod: the services, as other users, must write test storage.
    "B103",
    # xml.etree parsing: the XML comes from the servers under test.
    "B314",
]

[tool.black]
line-length = 108

[tool.isort]
line_length = 108
profile = "black"
src_paths = ["framework"]

[tool.pylint.basic]
# http.server dispatches to do_<METHOD>().
good-names-rgxs = ["^do_[A-Z]+$"]

[tool.pylint.messages-control]
enable = [
    "useless-suppression",
]
disable = [
    "duplicate-code",
    "line-too-long",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-statements",
]

[tool.pyright]
typeCheckingMode = "strict"

# test.py puts framework/ on sys.path.
extraPaths = ["framework"]

# Be more forgiving.
reportMissingTypeStubs = "none"

# Be less forgiving.
deprecateTypingAliases = true
reportImplicitOverride = true
reportUnnecessaryTypeIgnoreComment = true
reportUnreachable = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]

[tool.typos.default]
extend-ignore-words-re = [
    # Two- and three-letter "words" are common in code
    "^[[:alpha:]]{2,3}$",
]

[tool.typos.default.extend-words]
# Test data that does not exist
dne = "dne"
# Link header priorities
pri = "pri"
pris = "pris"

[tool.uv]
# Set `package = true` once the project ships a package under src/.
package = false

# Ignore package releases newer than this.
exclude-newer = "7 days"
