---
# The full topology. Run it through ./fed.sh: every variable below comes
# from presets/default.sh and has no fallback here on purpose.

name: pelican

# Only the dev container's build caches live in volumes. Service state
# and data are bind-mounted from ./state and ./data.
volumes:
  go_build:
  go_pkg:
  pre_commit:
  web_next:
  web_node:
  web_npm:
  web_output:
  root_homedir:

secrets:
  ca-crt:
    file: ./certs/ca.crt
  tls-crt:
    file: ./certs/tls.crt
  tls-key:
    file: ./certs/tls.key
  oidc-client-id:
    file: ./etc/oidc-client-id
  oidc-client-secret:
    file: ./etc/oidc-client-secret
  server-web-passwd:
    file: ./etc/server-web-passwd

#===========================================================================
# Shared fragments
#===========================================================================

# /certs/*.crt is added to the trust store by each image's entrypoint.
# /etc/pelican is ConfigBase for root, so the other three need no
# configuration.
x-common-secrets: &common-secrets
  secrets:
    - source: ca-crt
      target: /certs/ca.crt
    - source: tls-crt
      target: /certs/tls.crt
    - source: tls-key
      target: /certs/tls.key
    - source: oidc-client-id
      target: /etc/pelican/oidc-client-id
    - source: oidc-client-secret
      target: /etc/pelican/oidc-client-secret
    - source: server-web-passwd
      target: /etc/pelican/server-web-passwd

# Mounts common to every Pelican service. Each service also mounts its
# own /fed/conf.role, /fed/conf.instance, /fed/issuer-keys, and
# /var/lib/pelican. See etc/pelican.yaml for the configuration layers.
x-vol-health: &vol-health "./bin/service-health.sh:/fed/bin/service-health.sh:ro"
x-vol-generated: &vol-generated "./generated:/fed/generated:ro"
x-vol-conf-root: &vol-conf-root "./etc/pelican.yaml:/etc/pelican/pelican.yaml:ro"
x-vol-conf-base: &vol-conf-base "./config.d/base:/fed/conf.base:ro"

x-pelican-env: &pelican-env
  TZ: "${TZ_SERVICES:?run through ./fed.sh}"
  PELICAN_LOGGING_LEVEL: "${PELICAN_LOG_LEVEL:?run through ./fed.sh}"

# Environment beats every configuration file, so presets can toggle these.
x-origin-env: &origin-env
  PELICAN_ORIGIN_ENABLEISSUER: "${ORIGIN_ENABLE_ISSUER:?run through ./fed.sh}"
  PELICAN_ORIGIN_ENABLEOIDC: "${ORIGIN_ENABLE_OIDC:?run through ./fed.sh}"

x-pelican-health: &pelican-health
  test: ["CMD", "/fed/bin/service-health.sh"]
  start_period: 90s
  start_interval: 2s
  interval: 30s
  timeout: 10s
  retries: 3

x-needs-federation: &needs-federation
  discovery: { condition: service_healthy }
  director-0: { condition: service_healthy }
  registry: { condition: service_healthy }

# Narrows, but does not close, the window in which a new cache serves
# 403s. run.sh waits out the rest.
x-needs-origin: &needs-origin
  origin-0: { condition: service_healthy }

# Only matters under `-p ssh`; `required: false` makes it a no-op when
# the lab server is not started.
x-needs-lab: &needs-lab
  lab-server: { condition: service_healthy, required: false }

#===========================================================================
# Services
#
# `hostname` matters: it determines Server.ExternalWebUrl, and so each
# origin's issuer URL, which fed.sh must reproduce exactly.
#===========================================================================

services:

  # Hosts the federation metadata outside any director, as the OSDF does,
  # so that the directors are interchangeable.
  discovery:
    hostname: discovery
    image: nginx:alpine
    # 127.0.0.1, not localhost: BusyBox wget tries only the first address,
    # which may be ::1, and nginx listens on IPv4 only.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null",
             "http://127.0.0.1/.well-known/pelican-configuration"]
      start_period: 10s
      start_interval: 1s
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits: { memory: 32M }
    ports:
      - "9005:8444"
    volumes:
      - ./etc/nginx-discovery.conf:/etc/nginx/conf.d/default.conf:ro
      - ./generated/discovery.json:/etc/nginx/html/discovery.json:ro
      - ./generated/openid-configuration.json:/etc/nginx/html/openid-configuration.json:ro
    secrets:
      - source: tls-crt
        target: /certs/tls.crt
      - source: tls-key
        target: /certs/tls.key

  director-0:
    hostname: director-0
    image: "${IMAGE_DIRECTOR:?run through ./fed.sh}"
    healthcheck: *pelican-health
    depends_on:
      discovery: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: "${DIRECTOR_MEM:?run through ./fed.sh}" }
    environment: *pelican-env
    ports:
      - "9000:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - ./config.d/director/default:/fed/conf.role:ro
      - ./config.d/instance/director-0:/fed/conf.instance:ro
      - ./issuer-keys/director-0:/fed/issuer-keys
      - ./state/director-0:/var/lib/pelican
    <<: *common-secrets

  director-1:
    hostname: director-1
    image: "${IMAGE_DIRECTOR:?run through ./fed.sh}"
    profiles: ["ha"]
    healthcheck: *pelican-health
    depends_on:
      discovery: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: "${DIRECTOR_MEM:?run through ./fed.sh}" }
    environment: *pelican-env
    ports:
      - "9004:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - ./config.d/director/default:/fed/conf.role:ro
      - ./config.d/instance/director-1:/fed/conf.instance:ro
      # Must hold director-0's key: the discovery document publishes only
      # director-0's JWKS. `./fed.sh keys` keeps the two in step.
      - ./issuer-keys/director-1:/fed/issuer-keys
      - ./state/director-1:/var/lib/pelican
    <<: *common-secrets

  registry:
    hostname: registry
    image: "${IMAGE_REGISTRY:?run through ./fed.sh}"
    healthcheck: *pelican-health
    depends_on:
      discovery: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: "${REGISTRY_MEM:?run through ./fed.sh}" }
    environment: *pelican-env
    ports:
      - "9001:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - ./config.d/registry/default:/fed/conf.role:ro
      - ./config.d/instance/registry:/fed/conf.instance:ro
      - ./issuer-keys/registry:/fed/issuer-keys
      - ./state/registry:/var/lib/pelican
    <<: *common-secrets

  origin-0:
    hostname: origin-0
    image: "${IMAGE_ORIGIN:?run through ./fed.sh}"
    healthcheck: *pelican-health
    depends_on:
      <<: [*needs-federation, *needs-lab]
    deploy:
      resources:
        limits: { memory: "${ORIGIN_MEM:?run through ./fed.sh}" }
    # TZ is named explicitly: a merge key loses to an explicit key.
    environment:
      <<: [*pelican-env, *origin-env]
      TZ: "${TZ_STORAGE:?run through ./fed.sh}"
    ports:
      - "8444:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - "./config.d/origin/${ORIGIN_VARIANT:?run through ./fed.sh}:/fed/conf.role:ro"
      - ./config.d/instance/origin-0:/fed/conf.instance:ro
      - ./issuer-keys/origin-0:/fed/issuer-keys
      - ./data/origin/0:/data
      - ./state/origin-0:/var/lib/pelican
    <<: *common-secrets

  origin-1:
    hostname: origin-1
    image: "${IMAGE_ORIGIN:?run through ./fed.sh}"
    profiles: ["multi"]
    healthcheck: *pelican-health
    depends_on:
      <<: [*needs-federation, *needs-lab]
    deploy:
      resources:
        limits: { memory: "${ORIGIN_MEM:?run through ./fed.sh}" }
    environment:
      <<: [*pelican-env, *origin-env]
      TZ: "${TZ_STORAGE:?run through ./fed.sh}"
    ports:
      - "8446:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - "./config.d/origin/${ORIGIN_VARIANT:?run through ./fed.sh}:/fed/conf.role:ro"
      - ./config.d/instance/origin-1:/fed/conf.instance:ro
      # Must hold origin-0's key: both export the same prefixes, and the
      # registry binds one keyset per prefix. `./fed.sh keys` keeps the
      # two in step.
      - ./issuer-keys/origin-1:/fed/issuer-keys
      - ./data/origin/1:/data
      - ./state/origin-1:/var/lib/pelican
    <<: *common-secrets

  cache-0:
    hostname: cache-0
    image: "${IMAGE_CACHE:?run through ./fed.sh}"
    healthcheck: *pelican-health
    depends_on:
      <<: [*needs-federation, *needs-origin]
    deploy:
      resources:
        limits: { memory: "${CACHE_MEM:?run through ./fed.sh}" }
    environment:
      <<: *pelican-env
      TZ: "${TZ_STORAGE:?run through ./fed.sh}"
    ports:
      - "8445:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - "./config.d/cache/${CACHE_VARIANT:?run through ./fed.sh}:/fed/conf.role:ro"
      - ./config.d/instance/cache-0:/fed/conf.instance:ro
      - ./issuer-keys/cache-0:/fed/issuer-keys
      - ./data/cache/0:/data
      - ./state/cache-0:/var/lib/pelican
    <<: *common-secrets

  cache-1:
    hostname: cache-1
    image: "${IMAGE_CACHE:?run through ./fed.sh}"
    profiles: ["multi"]
    healthcheck: *pelican-health
    depends_on:
      <<: [*needs-federation, *needs-origin]
    deploy:
      resources:
        limits: { memory: "${CACHE_MEM:?run through ./fed.sh}" }
    environment:
      <<: *pelican-env
      TZ: "${TZ_STORAGE:?run through ./fed.sh}"
    ports:
      - "8447:8444"
    volumes:
      - *vol-health
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - "./config.d/cache/${CACHE_VARIANT:?run through ./fed.sh}:/fed/conf.role:ro"
      - ./config.d/instance/cache-1:/fed/conf.instance:ro
      - ./issuer-keys/cache-1:/fed/issuer-keys
      - ./data/cache/1:/data
      - ./state/cache-1:/var/lib/pelican
    <<: *common-secrets

  # Build environment and test client. The image ships no Pelican binary;
  # run.sh uses bin/linux via the checkout mounted at /scratch.
  dev:
    hostname: dev
    image: "${IMAGE_DEV:?run through ./fed.sh}"
    command: ["tini", "--", "/bin/sleep", "infinity"]
    deploy:
      resources:
        limits: { memory: "${DEV_MEM:?run through ./fed.sh}" }
    environment: *pelican-env
    ports:
      - "9002:8444"
    volumes:
      - "${PELICAN_SRC_DIR:?run through ./fed.sh}:/app"
      - .:/scratch
      - *vol-generated
      - *vol-conf-root
      - *vol-conf-base
      - ./config.d/none:/fed/conf.role:ro
      - ./config.d/instance/dev:/fed/conf.instance:ro
      # fed.sh creates this file if missing; otherwise Docker would create
      # a directory in its place.
      - "${HOME}/.gitconfig:/root/.gitconfig:ro"
      - go_build:/root/.cache/go-build
      - go_pkg:/root/go
      - pre_commit:/root/.cache/pre-commit
      - web_next:/app/web_ui/frontend/.next
      - web_node:/app/web_ui/frontend/node_modules
      - web_npm:/root/.npm
      - web_output:/app/web_ui/frontend/public/data
      - root_homedir:/root
    <<: *common-secrets

  lab-server:
    hostname: lab-server
    image: pelican-lab-server:local
    profiles: ["lab"]
    # Rebuild on every `up` (cached), so Dockerfile changes take effect.
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.sshd
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/22"]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 128M }
    volumes:
      - ./data/lab-server:/data
      - ./generated/ssh/authorized_keys:/home/alice/.ssh/authorized_keys:ro

  grafana:
    hostname: grafana
    # Pinned: Grafana migrates ./grafana forward with no way back.
    image: grafana/grafana:13.1
    profiles: ["monitoring"]
    # So that it can write ./grafana on a Linux host.
    user: root
    deploy:
      resources:
        limits: { memory: 256M }
    environment:
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "9003:3000"
    volumes:
      - ./grafana:/var/lib/grafana
